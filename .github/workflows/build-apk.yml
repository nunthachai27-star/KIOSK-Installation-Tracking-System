name: Build Android APK (KIOSK)

# Runs automatically when this workflow or the TWA config changes, and can also
# be run manually from the Actions tab. Publishes the signed .apk as a GitHub
# Release so it has a public download link.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      - name: Point Bubblewrap at the runner's JDK + Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create a signing key
        env:
          KS_PASS: kioskbms2569
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=KIOSK, O=BMS, L=Bangkok, C=TH"

      - name: Build the APK
        env:
          KS_PASS: kioskbms2569
        run: |
          bubblewrap build --skipPwaValidation <<EOF
          $KS_PASS
          $KS_PASS
          EOF

      - name: Generate assetlinks.json (for full-screen, no URL bar)
        env:
          KS_PASS: kioskbms2569
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "SHA256 fingerprint: $FP"
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "th.in.bmscloud.kiosktrack",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          cat assetlinks.json

      - name: Upload APK + keystore + assetlinks (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-android
          path: |
            app-release-signed.apk
            android.keystore
            assetlinks.json
          if-no-files-found: warn

      - name: Publish APK to a public GitHub Release (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: KIOSK APK — build ${{ github.run_number }}
          body: |
            แอป KIOSK (Android) — ไฟล์ `app-release-signed.apk` ด้านล่าง
            ดาวน์โหลด → เปิดบนมือถือ Android → อนุญาตติดตั้งจากแหล่งนอก Store → ติดตั้ง
          files: app-release-signed.apk
