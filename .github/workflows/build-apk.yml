name: Build Android APK (KIOSK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      - name: Point Bubblewrap at the runner's JDK + Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "SDK=$SDK"; ls "$SDK" | head
          yes | "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create a signing key
        env:
          KS_PASS: kioskbms2569
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=KIOSK, O=BMS, L=Bangkok, C=TH"

      - name: Build the APK (capture log, never fail the job)
        env:
          KS_PASS: kioskbms2569
        run: |
          set +e
          echo "=== bubblewrap version ===" | tee build.log
          bubblewrap --version 2>&1 | tee -a build.log
          echo "=== which bubblewrap ===" | tee -a build.log
          which bubblewrap 2>&1 | tee -a build.log
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "=== SDK diag ===" | tee -a build.log
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT SDK=$SDK" | tee -a build.log
          echo "-- config.json --" | tee -a build.log; cat ~/.bubblewrap/config.json | tee -a build.log; echo | tee -a build.log
          echo "-- ls SDK --" | tee -a build.log; ls -la "$SDK" 2>&1 | tee -a build.log
          echo "-- ls cmdline-tools --" | tee -a build.log; ls -la "$SDK/cmdline-tools" 2>&1 | tee -a build.log
          echo "-- ls build-tools --" | tee -a build.log; ls "$SDK/build-tools" 2>&1 | tee -a build.log
          echo "-- ls platform-tools --" | tee -a build.log; ls "$SDK/platform-tools" 2>&1 | head -3 | tee -a build.log
          echo "=== build ===" | tee -a build.log
          printf '%s\n%s\n' "$KS_PASS" "$KS_PASS" | bubblewrap build --skipPwaValidation 2>&1 | tee -a build.log
          echo "=== exit of build: ${PIPESTATUS[0]} ===" | tee -a build.log
          echo "=== files ===" | tee -a build.log
          ls -la 2>&1 | tee -a build.log
          true

      - name: Generate assetlinks.json
        if: always()
        env:
          KS_PASS: kioskbms2569
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "SHA256 fingerprint: $FP"
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": { "namespace": "android_app", "package_name": "th.in.bmscloud.kiosktrack", "sha256_cert_fingerprints": ["$FP"] }
          }]
          EOF
          cat assetlinks.json

      - name: Publish results to a public Release (apk if built, + build.log always)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: KIOSK APK — build ${{ github.run_number }}
          body: "ไฟล์ app-release-signed.apk (ถ้ามี) + build.log สำหรับตรวจสอบ"
          files: |
            app-release-signed.apk
            build.log
            assetlinks.json
          fail_on_unmatched_files: false
